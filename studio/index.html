<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Media Studio — 我的媒体工作台</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#182235;background:#f6f8fb}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}
.app{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}
aside{background:#fff;border-right:1px solid #e9edf4;padding:26px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;margin:4px 9px 35px}.brandmark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#202e4a;color:white}
.navtitle{font-size:11px;letter-spacing:1.5px;font-weight:700;color:#929cae;padding:0 13px;margin:24px 0 10px}
.nav{width:100%;border:0;background:transparent;padding:12px 14px;text-align:left;border-radius:11px;color:#677388;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}
.nav.active,.nav:hover{color:#1d3f83;background:#edf3ff}.nav span:first-child{font-size:18px;width:22px}
.sidebar-bottom{margin-top:auto;background:#f6f8fb;border:1px solid #edf0f5;border-radius:14px;padding:13px;font-size:12px;color:#7d889c;line-height:1.7}
main{padding:31px clamp(16px,3.3vw,51px) 55px;min-width:0}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px}
h1{margin:0 0 8px;font-size:29px;letter-spacing:-.9px}h2{margin:0;font-size:18px}.muted{color:#8a96a8;font-size:13px}
button.primary{border:0;border-radius:11px;padding:12px 17px;background:#273c65;color:#fff;font-weight:650}button.primary:hover{background:#1b2d4d}
button.ghost{border:1px solid #e4e9f1;background:#fff;padding:10px 14px;border-radius:10px;color:#47556c;font-weight:600;font-size:13px}
button.ghost:hover{background:#f4f7fb}.toolbar,.bulkbar,.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:23px}.stat{background:#fff;border:1px solid #ebeff5;border-radius:16px;padding:18px 20px;box-shadow:0 3px 20px #25334c05}.stat strong{font-size:25px;display:block;margin:7px 0 2px}.stat small{color:#919cab}
.panel{background:#fff;border:1px solid #e9edf3;border-radius:18px;padding:22px;box-shadow:0 4px 24px #1f2d4b05}
.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:17px}.search{flex:1;min-width:170px;max-width:385px;padding:11px 13px;border:1px solid #e3e9f1;border-radius:10px;background:#f9fafc;outline:none}.search:focus{border-color:#7c9bdd}
select{border:1px solid #e3e9f1;background:#fff;border-radius:10px;padding:10px 10px;color:#526177;max-width:180px}
.filterbar{justify-content:space-between;border-top:1px solid #f0f2f6;padding-top:15px;margin-top:17px}
.chip{background:#f4f6fa;color:#66748b;border:0;border-radius:9px;padding:9px 13px;font-weight:650;font-size:12px}.chip.on{background:#eaf0ff;color:#3157a5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-top:19px}
.tile{position:relative;min-width:0;border:1px solid #e8edf5;border-radius:14px;background:#fff;overflow:hidden;transition:border-color .18s,box-shadow .18s;cursor:pointer}
.tile:hover{box-shadow:0 8px 24px #17254216}.tile.picked{border:2px solid #5271cc;box-shadow:0 0 0 3px #6588df25}
.media{height:178px;background:#f0f3f8;display:grid;place-items:center;overflow:hidden;position:relative}
.media img,.media video{width:100%;height:100%;object-fit:cover}.fileicon{font-size:40px;color:#9aa7bd}.check{position:absolute;top:11px;left:11px;width:22px;height:22px;accent-color:#5272c2;cursor:pointer;z-index:2}
.tags{position:absolute;bottom:10px;right:10px;display:flex;gap:5px}.overlay-tag{background:#ffffffec;border-radius:6px;padding:4px 6px;font-size:10px;color:#4e5b73;font-weight:750}
.details{padding:11px 12px}.filename{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{margin-top:7px;font-size:11px;color:#9aa5b7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bulkbar{position:sticky;top:10px;z-index:10;margin-top:17px;background:#233652;color:white;padding:11px 14px;border-radius:12px;box-shadow:0 8px 28px #2539573a}
.bulkbar button{color:#253957;border:0;background:#fff;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700}
.bulkbar button.danger{color:#a13232}.bulkbar .count{font-size:13px;font-weight:800;margin-right:8px}
.bottom-actions{display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap}
.notice{font-size:12px;color:#7e8aa0;padding:10px 0;line-height:1.6}
.empty{text-align:center;padding:50px 10px;color:#8b98ab}.toast{position:fixed;bottom:24px;right:26px;z-index:30;background:#233652;color:#fff;max-width:370px;border-radius:12px;padding:13px 17px;box-shadow:0 10px 30px #22365429;display:none;font-size:13px}
dialog{border:1px solid #e9edf5;border-radius:18px;box-shadow:0 30px 100px #13203a55;max-width:min(800px,93vw);width:100%;padding:0}dialog::backdrop{background:#14233a9c}
.modalhead{display:flex;justify-content:space-between;align-items:center;padding:15px 19px;border-bottom:1px solid #edf0f5}.modalbody{padding:18px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(170px,1fr);gap:20px}.modalbody img,.modalbody video{width:100%;max-height:65vh;object-fit:contain;background:#f2f4f8;border-radius:9px}
.modalinfo{font-size:13px;line-height:2.2;overflow-wrap:anywhere}.close{border:0;background:#f3f5f9;border-radius:8px;padding:7px 10px}
.authscreen{max-width:440px;margin:7vh auto;background:#fff;border:1px solid #e7edf4;border-radius:19px;padding:30px;box-shadow:0 10px 40px #1528460f}.authscreen input{width:100%;margin:7px 0 14px;padding:13px;border:1px solid #dfe5f0;border-radius:11px}
.authscreen label{font-size:12px;font-weight:700;color:#65748b}.authscreen h2{margin-bottom:10px}.authscreen .primary{width:100%}
.hidden{display:none!important}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:relative;height:auto;padding:15px;flex-direction:row;align-items:center;overflow:auto;gap:6px}aside .brand{margin:0 10px 0 0;white-space:nowrap}aside .navtitle,aside .sidebar-bottom{display:none}aside .nav{width:auto;white-space:nowrap}main{padding:20px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.modalbody{grid-template-columns:1fr}}
@media(max-width:540px){h1{font-size:23px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:13px}.panel{padding:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.media{height:135px}.top{align-items:center}.bulkbar{top:0}}
</style>
</head>
<body>
<div id="auth" class="authscreen">
<div class="brand"><span class="brandmark">M</span><span>Media Studio</span></div>
<h2>进入媒体工作台</h2><p class="muted">使用已有的图床后台账号登录。凭据只保存在当前页面的内存中，刷新页面后需要重新登录。</p>
<form id="loginForm">
<label for="user">后台用户名</label><input id="user" autocomplete="username" required>
<label for="pass">后台密码</label><input id="pass" type="password" autocomplete="current-password" required>
<button class="primary" type="submit">进入工作台 →</button>
</form><p class="notice" id="loginError">后台账号对应 Cloudflare 的 BASIC_USER / BASIC_PASS。请先确保这两项都已配置。</p>
</div>
<div class="app hidden" id="app">
<aside>
<div class="brand"><span class="brandmark">M</span><span>Media Studio</span></div>
<div class="navtitle">媒体空间</div>
<button class="nav active" data-view="all"><span>▦</span>全部素材</button>
<button class="nav" data-view="image"><span>▧</span>图片</button>
<button class="nav" data-view="video"><span>▣</span>视频</button>
<button class="nav" data-view="favorites"><span>♡</span>我的收藏</button>
<button class="nav" data-view="published"><span>✧</span>AI 已发布</button>
<div class="navtitle">工作区</div>
<button class="nav" data-view="album"><span>▤</span>相册 / 项目</button>
<div class="sidebar-bottom">☁ Telegram + Cloudflare<br>所有图片保留原链接。<br><a href="/admin-imgtc.html">旧版后台 ↗</a></div>
</aside>
<main>
<div class="top">
<div><h1 id="pageTitle">全部素材</h1><div class="muted">管理你的图片、视频、私人收藏和工作素材</div></div>
<div class="toolbar"><button id="reload" class="ghost">↻ 刷新</button><button id="uploadBtn" class="primary">↑ 上传素材</button><input id="fileInput" type="file" accept="image/*,video/*" multiple class="hidden"></div>
</div>
<div class="stats">
<div class="stat"><span class="muted">已加载素材</span><strong id="statAll">0</strong><small>支持继续加载</small></div>
<div class="stat"><span class="muted">已收藏</span><strong id="statFavorite">0</strong><small>仅在当前已加载素材中</small></div>
<div class="stat"><span class="muted">已发布给 AI</span><strong id="statAI">0</strong><small>公开目录中的已加载素材</small></div>
</div>
<section class="panel">
<div class="heading"><div><h2>素材资源管理</h2><div class="muted" id="resultCount" style="margin-top:5px">加载中...</div></div><button id="selectPage" class="ghost">✓ 全选当前结果</button></div>
<div class="toolbar"><input id="search" class="search" placeholder="⌕ 搜索文件名、标签、相册..." aria-label="搜索素材"><select id="albumFilter"><option value="">所有相册</option></select><select id="order"><option value="new">最新上传</option><option value="old">最早上传</option><option value="name">名称排序</option></select></div>
<div class="filterbar"><div class="toolbar" id="chips"><button data-chip="all" class="chip on">全部</button><button data-chip="image" class="chip">图片</button><button data-chip="video" class="chip">视频</button><button data-chip="favorites" class="chip">收藏</button><button data-chip="published" class="chip">AI 已发布</button></div><span class="muted" id="selectedInfo">未选择</span></div>
<div id="bulkbar" class="bulkbar hidden"><span class="count" id="selectedCount">已选择 0 项</span><button data-action="favorite">♡ 收藏</button><button data-action="unfavorite">取消收藏</button><button data-action="add_tags">＋ 标签</button><button data-action="remove_tags">－ 标签</button><button data-action="add_albums">＋ 相册</button><button data-action="remove_albums">－ 相册</button><button data-action="set_category">分类</button><button data-action="publish">✧ 发布 AI</button><button data-action="unpublish">撤销 AI 发布</button><button id="clearSelection">清除选择</button></div>
<div id="grid" class="grid" aria-live="polite"></div>
<div class="bottom-actions">
<button id="loadMore" class="ghost">加载更多素材</button>
<button id="selectAllMatched" class="ghost">选择全部匹配结果（包含未加载页）</button>
<button id="clearFilter" class="ghost">清空筛选</button>
</div>
<div id="status" class="notice"></div>
</section>
</main>
</div>
<dialog id="preview"><div class="modalhead"><strong>文件预览</strong><button class="close" id="closePreview">✕</button></div><div class="modalbody"><div id="previewMedia"></div><div class="modalinfo" id="previewInfo"></div></div></dialog>
<div id="toast" class="toast" role="status"></div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const state = { auth:null,items:[],seen:new Set(),selected:new Set(),cursor:null,complete:false,busy:false,chip:'all',view:'all',limit:100 };
const IMG = /\.(png|jpe?g|gif|webp|bmp|tiff?|ico|avif|apng)$/i;
const VID = /\.(mp4|webm|mov|ogg|m4v|mkv|avi)$/i;
const safeText = v => String(v ?? '');
const getType = id => IMG.test(id) ? 'image' : VID.test(id) ? 'video' : 'other';
const isSafeId = id => /^[A-Za-z0-9_-]{5,300}\.[A-Za-z0-9]{2,12}$/.test(id);
const fileUrl = id => '/file/' + encodeURIComponent(id);
function toast(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',4200);}
function authHeader(){return {'Authorization': 'Basic '+state.auth};}
async function api(url,options={}){
  const r=await fetch(url,{...options,headers:{...authHeader(),...(options.headers||{})},cache:'no-store'});
  if(r.status===401){toast('后台登录已失效，请刷新重新登录');throw Error('登录失败 (401)');}
  if(!r.ok)throw Error('接口错误 '+r.status+'：'+(await r.text()).slice(0,160));
  return r.json();
}
function normalize(raw){
  const m=raw.metadata||{},id=raw.name;
  return {id,name:m.fileName||id,bytes:Number(m.fileSize)||0,date:Number(m.TimeStamp)||0,liked:m.liked===true,published:m.aiPublished===true,
    tags:Array.isArray(m.tags)?m.tags.filter(x=>typeof x==='string'):[],
    albums:Array.isArray(m.albums)?m.albums.filter(x=>typeof x==='string'):[],category:m.category||'',type:getType(id)};
}
async function loadPage(reset=false){
  if(state.busy)return;
  state.busy=true;$('loadMore').disabled=true;$('status').textContent='读取中...';
  try{
    if(reset){state.items=[];state.seen.clear();state.cursor=null;state.complete=false;state.selected.clear();}
    const p=new URLSearchParams({limit:String(state.limit)});
    if(state.cursor)p.set('cursor',state.cursor);
    const r=await api('/api/manage/list?'+p);
    for(const record of r.keys||[]){
      if(!isSafeId(record.name)||state.seen.has(record.name))continue;
      state.seen.add(record.name);state.items.push(normalize(record));
    }
    state.cursor=r.list_complete?null:(r.cursor||null);
    state.complete=Boolean(r.list_complete)||!state.cursor;
    render();
    $('status').textContent=state.complete?'已经读取全部记录。':'还有未加载的素材；如需跨页选择，请使用「选择全部匹配结果」。';
    return true;
  }catch(e){toast(e.message);$('status').textContent='加载失败：'+e.message;return false;}
  finally{state.busy=false;$('loadMore').disabled=state.complete;}
}
function filterItems(){
  const q=$('search').value.trim().toLowerCase(),album=$('albumFilter').value;
  let result=state.items.filter(x=>(state.chip==='all'||(state.chip==='favorites'?x.liked:state.chip==='published'?x.published:x.type===state.chip))
    &&(!album||x.albums.includes(album))
    &&(!q||[x.name,x.id,x.category,...x.tags,...x.albums].join(' ').toLowerCase().includes(q)));
  if($('order').value==='old')result.sort((a,b)=>a.date-b.date);
  else if($('order').value==='name')result.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));
  else result.sort((a,b)=>b.date-a.date);
  return result;
}
function elt(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function render(){
  const list=filterItems(),grid=$('grid');grid.replaceChildren();
  const albumSelect=$('albumFilter'),chosen=albumSelect.value;
  const albums=[...new Set(state.items.flatMap(x=>x.albums))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
  albumSelect.replaceChildren(new Option('所有相册',''));for(const a of albums)albumSelect.add(new Option(a,a));
  albumSelect.value=albums.includes(chosen)?chosen:'';
  $('resultCount').textContent='当前匹配 '+list.length+' 项 · 已加载 '+state.items.length+' 项';
  $('statAll').textContent=state.items.length;
  $('statFavorite').textContent=state.items.filter(x=>x.liked).length;
  $('statAI').textContent=state.items.filter(x=>x.published).length;
  $('selectedInfo').textContent='选中 '+state.selected.size+' 项';
  $('selectedCount').textContent='已选 '+state.selected.size+' 项';
  $('bulkbar').classList.toggle('hidden',state.selected.size===0);
  $('loadMore').classList.toggle('hidden',state.complete);
  $('selectAllMatched').classList.toggle('hidden',state.complete);
  $('selectPage').textContent=list.length&&list.every(x=>state.selected.has(x.id))?'取消全选当前结果':'✓ 全选当前结果';
  if(!list.length){grid.append(elt('div','empty','没有匹配的素材。请调整搜索或筛选条件。'));return;}
  const frag=document.createDocumentFragment();
  for(const x of list){
    const tile=elt('article','tile'+(state.selected.has(x.id)?' picked':''));tile.tabIndex=0;tile.setAttribute('aria-label','查看 '+x.name);
    const media=elt('div','media');
    if(x.type==='image'){
      const img=elt('img');img.src=fileUrl(x.id);img.alt=x.name;img.loading='lazy';media.append(img);
    }else if(x.type==='video'){
      const v=elt('video');v.src=fileUrl(x.id);v.preload='metadata';v.muted=true;v.playsInline=true;media.append(v);
    }else media.append(elt('span','fileicon','▤'));
    const check=elt('input','check');check.type='checkbox';check.checked=state.selected.has(x.id);check.setAttribute('aria-label','选择 '+x.name);
    check.addEventListener('click',e=>e.stopPropagation());check.addEventListener('change',()=>select(x.id,check.checked));
    media.append(check);
    const tags=elt('div','tags');
    if(x.liked)tags.append(elt('span','overlay-tag','♡ 收藏'));
    if(x.published)tags.append(elt('span','overlay-tag','✧ AI'));
    media.append(tags);tile.append(media);
    const details=elt('div','details');details.append(elt('div','filename',x.name));
    details.append(elt('div','sub',[x.category||x.type.toUpperCase(),formatBytes(x.bytes),...x.albums.slice(0,1)].filter(Boolean).join(' · ')));
    tile.append(details);tile.addEventListener('click',()=>preview(x));tile.addEventListener('keydown',e=>{if(e.key==='Enter')preview(x);});
    frag.append(tile);
  }
  grid.append(frag);
}
function formatBytes(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?(n/1024).toFixed(1)+' KB':n+' B';}
function select(id,checked){checked?state.selected.add(id):state.selected.delete(id);render();}
function setChip(chip){
  state.chip=chip;document.querySelectorAll('.chip').forEach(el=>el.classList.toggle('on',el.dataset.chip===chip));
  document.querySelectorAll('.nav').forEach(el=>el.classList.toggle('active',el.dataset.view===chip||chip==='all'&&el.dataset.view==='all'));
  $('pageTitle').textContent=({all:'全部素材',image:'图片',video:'视频',favorites:'我的收藏',published:'AI 已发布',album:'我的相册'})[chip]||'全部素材';
  render();
}
function preview(x){
  const zone=$('previewMedia');zone.replaceChildren();
  if(x.type==='image'){const img=elt('img');img.src=fileUrl(x.id);img.alt=x.name;zone.append(img);}
  else if(x.type==='video'){const v=elt('video');v.src=fileUrl(x.id);v.controls=true;v.autoplay=false;zone.append(v);}
  else zone.append(elt('p','', '文件预览不可用'));
  const info=$('previewInfo');info.replaceChildren();
  for(const [label,val] of [['文件名',x.name],['文件大小',formatBytes(x.bytes)],['类型',x.type],['收藏',x.liked?'是':'否'],['AI 发布',x.published?'已发布':'未发布'],['标签',x.tags.join('、')||'无'],['相册',x.albums.join('、')||'无'],['分类',x.category||'无']]){
    const line=elt('div');line.append(elt('strong','',label+'：'),document.createTextNode(safeText(val)));info.append(line);
  }
  const btn=elt('button','primary','复制真实链接');btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.origin+fileUrl(x.id));toast('已复制图片链接');}catch{toast('无法复制，请检查浏览器权限');}});
  info.append(btn);$('preview').showModal();
}
function actionPayload(action){
  if(action==='set_category'){
    const category=prompt('为所选素材设置统一分类（留空可清除分类）：');
    return category===null?null:{category:category.trim()};
  }
  if(action==='add_tags'||action==='remove_tags'||action==='add_albums'||action==='remove_albums'){
    const label=action.includes('tags')?'标签':'相册';
    const raw=prompt('输入要批量'+(action.startsWith('remove')?'移除':'添加')+'的'+label+'，多个用英文逗号分隔：');
    if(raw===null)return null;
    const names=raw.split(',').map(x=>x.trim()).filter(Boolean);
    if(!names.length)return null;
    return {names};
  }
  return {};
}
async function runAction(action){
  if(state.busy||!state.selected.size)return;
  const additional=actionPayload(action);if(additional===null)return;
  const ids=[...state.selected];
  if(action==='publish'&&!confirm('将 '+ids.length+' 个媒体标记为 AI 已发布。符合图片格式的文件会出现在无需登录的公开目录里，确认继续？'))return;
  state.busy=true;
  let ok=0,fail=0;const failed=[];
  try{
    for(let i=0;i<ids.length;i+=50){
      const chunk=ids.slice(i,i+50);
      $('status').textContent='正在批量处理 '+Math.min(i+chunk.length,ids.length)+' / '+ids.length+' ...';
      const r=await api('/api/manage/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,ids:chunk,...additional})});
      ok+=r.success||0;fail+=r.failed||0;
      for(const result of r.results||[]){
        if(!result.ok){failed.push(result.id);continue;}
        const item=state.items.find(x=>x.id===result.id);if(!item)continue;
        item.liked=result.metadata.liked;item.published=result.metadata.aiPublished;
        item.tags=result.metadata.tags;item.albums=result.metadata.albums;item.category=result.metadata.category;
      }
      render();
    }
    state.selected=new Set(failed);
    $('status').textContent='操作完成：成功 '+ok+' 项，失败 '+fail+' 项。'+(fail?'失败项目仍保持选中，可重试。':'');
    toast('操作完成：成功 '+ok+' 项，失败 '+fail+' 项');
  }catch(e){toast('操作中断：'+e.message);$('status').textContent='部分请求可能已完成，请刷新检查后重试。';}
  finally{state.busy=false;render();}
}
async function selectAllMatching(){
  if(state.busy)return;
  if(!confirm('将读取全部剩余页面并选中匹配当前筛选条件的素材。素材很多时可能需要较多请求，确定吗？'))return;
  let pages=0;
  while(!state.complete&&pages<100){
    const loaded=await loadPage();pages++;
    if(!loaded)break;
  }
  for(const x of filterItems())state.selected.add(x.id);
  render();
  $('status').textContent='已经选中 '+state.selected.size+' 项。'+(!state.complete?' 为限制请求，最多自动加载 100 页；还有记录未加载。':'');
}
async function upload(files){
  if(!files||!files.length)return;
  if(!confirm('上传 '+files.length+' 个文件到图床？图片不会自动收藏或发布给 AI。'))return;
  let good=0,failed=0;
  for(const file of files){
    try{
      const fd=new FormData();fd.append('file',file);
      const response=await fetch('/upload',{method:'POST',body:fd,cache:'no-store'});
      if(!response.ok)throw Error('上传失败 HTTP '+response.status);
      const result=await response.json();if(!Array.isArray(result)||!result[0]?.src)throw Error('上传响应异常');
      good++;
    }catch(e){failed++;console.error('upload failed',file.name,e);}
    $('status').textContent='上传进度 '+(good+failed)+' / '+files.length;
  }
  toast('上传成功 '+good+'，失败 '+failed);
  await loadPage(true);
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const user=$('user').value,pass=$('pass').value;
  const bytes=new TextEncoder().encode(user+':'+pass);
  let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));
  const candidate=btoa(binary);
  try{
    const response=await fetch('/api/manage/list?limit=1',{headers:{'Authorization':'Basic '+candidate},cache:'no-store'});
    if(!response.ok)throw Error('登录验证未通过：HTTP '+response.status);
    const json=await response.json();if(!Array.isArray(json.keys))throw Error('KV 图床后台不可用');
    state.auth=candidate;$('pass').value='';$('auth').classList.add('hidden');$('app').classList.remove('hidden');await loadPage();
  }catch(err){$('loginError').textContent=err.message;}
});
$('reload').addEventListener('click',()=>loadPage(true));
$('search').addEventListener('input',render);
$('albumFilter').addEventListener('change',render);
$('order').addEventListener('change',render);
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-chip]');if(b)setChip(b.dataset.chip);});
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.view==='album'){$('albumFilter').focus();setChip('all');return;}
  setChip(b.dataset.view);
}));
$('selectPage').addEventListener('click',()=>{
  const matches=filterItems();const all=matches.every(x=>state.selected.has(x.id));
  matches.forEach(x=>all?state.selected.delete(x.id):state.selected.add(x.id));render();
});
$('clearSelection').addEventListener('click',()=>{state.selected.clear();render();});
$('bulkbar').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)runAction(b.dataset.action);});
$('loadMore').addEventListener('click',()=>loadPage());
$('selectAllMatched').addEventListener('click',selectAllMatching);
$('clearFilter').addEventListener('click',()=>{$('search').value='';$('albumFilter').value='';setChip('all');});
$('closePreview').addEventListener('click',()=>$('preview').close());
$('uploadBtn').addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change',e=>{upload([...e.target.files]);e.target.value='';});
})();
</script>
